plugins {
    id 'java'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
}

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = project.mod_archive_name
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

minecraft {
    // NeoForge 版本（MC 1.21.1）。需 21.1.228+，用户环境 21.1.248。
    version = project.neo_forge_version
}

// ===== 仓库 =====
// Create / Ponder / Flywheel 官方仓库；Registrate 快照仓库；NeoForge 本体仓库。
repositories {
    // 本地镜像优先（离线/弱网时使用）
    maven { url = uri('file:///C:/Users/guan/local-maven-repo') }
    mavenCentral()
    maven { url = "https://maven.createmod.net" }          // Create, Ponder, Flywheel
    maven { url = "https://maven.ithundxr.dev/snapshots" } // Registrate
    maven { url = "https://maven.neoforged.net/releases" } // NeoForge userdev / 插件链
}

dependencies {
    // NeoForge 本体
    implementation "net.neoforged:neoforge:${project.neo_forge_version}"

    // —— Create 6.0.10 官方 addon 依赖（neoforge-1.21.1，canonical）——
    // 继承 RopeWinchBlock/RopeWinchBlockEntity 会牵扯到 Create 的
    // KineticBlockEntity / SmartBlockEntity / DirectionalAxisKineticBlock 等父类，
    // 其引用的 net.createmod.ponder.api.VirtualBlockEntity 等必须显式声明，否则编译缺类。
    implementation("com.simibubi.create:create-1.21.1:6.0.10-280:slim") { transitive = false }
    implementation("net.createmod.ponder:ponder-neoforge:1.0.82+mc1.21.1")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-1.21.1:1.0.6")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-1.21.1:1.0.6")
    implementation("com.tterrag.registrate:Registrate:MC1.21-1.3.0+67")

    // —— Simulated(=机械动力：航空学/物理模拟) 1.3.1 + Sable 2.0.5 ——
    // 本机已安装的 MOD jar 本地依赖（与游戏目录一致，MoJmap，已 javap 核对 API）。
    // 本 MOD 真正的 API 依赖只有 simulated（绳索绞盘类在其中）；
    // create / sable 仅作为 simulated 的传递依赖用于编译其父类，非直接 API。
    implementation files("libs/simulated-1.3.1.jar")
    implementation files("libs/sable-2.0.5.jar")

    // Aeronautics(航空学 bundle) 1.3.1 仅作运行时/生产环境配套（neoforge.mods.toml 中声明依赖），
    // 编译不直接引用其类，故此处不挂编译依赖。
}

// NeoForge userdev 自动提供 runClient / runServer / runData 等任务。
tasks.named('build') {
    dependsOn 'jar'
}

// NeoGradle 会把 project.version 覆盖为 NeoForge 版本号（21.1.248），
// 导致产物名为 rope_winch_plus-21.1.248.jar。显式把 jar 的 archiveVersion
// 固定为 mod_version（1.0.0），使产物名符合预期。
tasks.named('jar') {
    archiveVersion = project.mod_version
}
