org.gradle.jvmargs=-Xmx2048M
org.gradle.daemon=false

# 指向本机已装的 JDK 21（避免 Gradle toolchain 自行联网下载 JDK）
org.gradle.java.installations.paths=D:/jdk-21
# 关闭自动探测/下载，强制只用上面的 JDK 21，避免抓到其它 JDK 版本当守护进程
org.gradle.java.installations.auto-detect=false
org.gradle.java.installations.auto-download=false

# 代理（离线构建 --offline 时不会被使用，仅在线拉依赖时生效）
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=50410
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=50410
systemProp.http.nonProxyHosts=localhost|127.0.0.1
systemProp.https.nonProxyHosts=localhost|127.0.0.1

# ===== 版本（与用户游戏环境一致，2026-09-03 核实）=====
minecraft_version=1.21.1
neo_forge_version=21.1.248

# Create / Aeronautics / Sable 实际安装版本（仅作记录，依赖走本地 libs/）
create_version=6.0.10
simulated_version=1.3.1
aeronautics_version=1.3.1
sable_version=2.0.5

# ===== MOD 元信息 =====
mod_version=1.0.0
mod_group_id=com.rope_winch_plus
mod_archive_name=rope_winch_plus
mod_id=rope_winch_plus
